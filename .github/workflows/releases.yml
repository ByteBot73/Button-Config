name: Build and Release

on:
  push:
    branches:
      - main  # Runs every time you push to the main branch

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # Allows the script to create releases

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Install Velopack Tool
      run: dotnet tool install -g vpk

    - name: Publish App
      run: dotnet publish -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true

    - name: Get Version from CSPROJ
      id: get_version
      shell: pwsh
      run: |
        [xml]$csproj = Get-Content (Get-ChildItem *.csproj).FullName
        $version = $csproj.Project.PropertyGroup.Version
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT

    - name: Run Velopack Pack
      run: |
        vpk pack --packId "ButtonConfig" --packVersion "${{ steps.get_version.outputs.VERSION }}" --packDir "bin/Release/net8.0-windows/win-x64/publish" --mainExe "Button Config.exe"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.get_version.outputs.VERSION }}
        name: Release v${{ steps.get_version.outputs.VERSION }}
        files: |
          Releases/RELEASES
          Releases/releases.win
          Releases/*.nupkg
          Releases/*Setup.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}